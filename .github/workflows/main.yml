name: GitHub Metrics

on:
  # Permite execução manual do workflow
  workflow_dispatch:

  # Executa automaticamente todo dia às 6h da manhã (UTC)
  schedule:
    - cron: "0 6 * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token de autenticação (obrigatório)
          token: ${{ secrets.METRICS_TOKEN }}

          # Seu usuário do GitHub
          user: ArthurSouzaDev

          # Nome do arquivo que será gerado
          filename: assets/metrics.svg

          # Seções base a serem incluídas
          base: header, activity, community, repositories, metadata

          # Plugin de linguagens de programação
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Plugin de linhas de código
          plugin_lines: yes

          # Fuso horário para datas
          config_timezone: America/Sao_Paulo

      # Card separado: linguagens mais utilizadas
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ArthurSouzaDev
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # Card separado: conquistas (equivalente aos troféus)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ArthurSouzaDev
          filename: assets/metrics.achievements.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
