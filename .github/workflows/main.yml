name: GitHub Metrics

on:
  # Permite execução manual do workflow
  workflow_dispatch:

  # Executa automaticamente todo dia às 6h da manhã (UTC)
  schedule:
    - cron: "0 6 * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token de autenticação (obrigatório)
          token: ${{ secrets.METRICS_TOKEN }}

          # Seu usuário do GitHub
          user: ArthurSouzaDev

          # Nome do arquivo que será gerado
          filename: assets/metrics.svg

          # Só o essencial: identificação, atividade e repositórios.
          # Removidos "community" (seguindo/starred/watching) e "metadata" (rodapé).
          base: header, activity, repositories

          # Fuso horário para datas
          config_timezone: America/Sao_Paulo

          # Linguagens: só as mais usadas, em porcentagem
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6

          # Conquistas: apenas as de rank mais alto
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
